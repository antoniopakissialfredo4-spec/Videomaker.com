<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="800" fill="#000000"/>
  
  <g transform="translate(400, 270)">
    <!-- Methodist Flame (Red) -->
    <!-- Left red flame curving dynamically along and behind the cross -->
    <path d="M 12 -230 
             C 12 -230 -40 -180 -70 -120 
             C -110 -40 -120 40 -80 110 
             C -60 145 -30 170 12 210
             C 3 180 -10 150 -15 120
             C -25 70 -5 20 20 -15
             C -5 -5 -35 -40 -40 -90
             C -45 -140 -15 -190 12 -230 Z" 
          fill="#E50914" />
          
    <path d="M 8 -180
             C -20 -140 -40 -90 -28 -35
             C -20 5 -5 35 12 55
             C 0 25 -10 -5 -8 -35
             C -6 -75 2 -125 8 -180 Z"
          fill="#B91C1C" opacity="0.6"/>

    <!-- Latin Cross (Methodist Cross in crisp white with subtle depth) -->
    <!-- Horizontal Cross Bar -->
    <rect x="-85" y="-95" width="170" height="26" rx="2" fill="#FFFFFF" />
    <!-- Vertical Cross Bar -->
    <rect x="-13" y="-195" width="26" height="340" rx="2" fill="#FFFFFF" />
    
    <!-- Subtle 3D shadow bevel on the cross -->
    <path d="M -13 -195 L -6 -195 L -6 145 L -13 145 Z" fill="#E2E8F0" opacity="0.4"/>
    <path d="M -85 -95 L 85 -95 L 85 -88 L -85 -88 Z" fill="#FFFFFF" opacity="0.8"/>
  </g>

  <!-- Typography Section -->
  <g id="brand-text">
    <!-- VIDEOMAKER -->
    <g transform="translate(400, 560)">
      <!-- VIDEO in White -->
      <text x="-345" y="0" font-family="'Inter', sans-serif" font-weight="900" font-size="94" fill="#FFFFFF" letter-spacing="-1">VIDE</text>
      
      <!-- 'O' with Play Button inside -->
      <g transform="translate(-85, -34)">
        <!-- Outer circular ring 'O' -->
        <circle cx="34" cy="3" r="42" fill="none" stroke="#FFFFFF" stroke-width="19" />
        <!-- Red Play Triangle inside 'O' -->
        <polygon points="26,-15 50,3 26,21" fill="#E50914" />
      </g>
      
      <!-- MAKER in Red -->
      <text x="10" y="0" font-family="'Inter', sans-serif" font-weight="900" font-size="94" fill="#E50914" letter-spacing="-1">MAKER</text>
    </g>

    <!-- Red Separator Lines and IGREJA METODISTA -->
    <g transform="translate(400, 608)">
      <!-- Left line -->
      <line x1="-350" y1="-8" x2="-235" y2="-8" stroke="#E50914" stroke-width="5" stroke-linecap="round"/>
      <!-- Text -->
      <text x="0" y="0" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="700" font-size="28" fill="#FFFFFF" letter-spacing="10">IGREJA METODISTA</text>
      <!-- Right line -->
      <line x1="235" y1="-8" x2="350" y2="-8" stroke="#E50914" stroke-width="5" stroke-linecap="round"/>
    </g>

    <!-- FERNANDO KIBUBA -->
    <text x="400" y="675" text-anchor="middle" font-family="'Inter', sans-serif" font-weight="900" font-size="46" fill="#FFFFFF" letter-spacing="6">FERNANDO KIBUBA</text>
  </g>
</svg>
